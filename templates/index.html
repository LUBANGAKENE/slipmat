<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slipmat</title>
<style>
  :root{
    --bg:#0e0d0c; --panel:#171614; --line:#2b2825; --line2:#3a3631;
    --ink:#ece6da; --dim:#8d857a; --amber:#d99b3f; --amber-dim:#7a5a24;
    --ok:#5f9e6a; --bad:#c4614f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}

  header{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.02em;font-weight:600}
  header .sub{color:var(--dim);font-size:13px}

  #auth{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
  #auth input{background:var(--bg);border:1px solid var(--line2);border-radius:6px;
    color:var(--ink);padding:6px 9px;font-size:13px;width:128px}
  #auth input::placeholder{color:var(--dim)}
  #auth .who{color:var(--dim)}
  #auth .err{color:var(--bad);font-size:12px;max-width:220px}

  .tabs{display:none;gap:6px;margin-bottom:16px}
  .tab{background:transparent;border:1px solid var(--line2);color:var(--dim);
    border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer}
  .tab.active{border-color:var(--amber);color:var(--ink)}

  .lib-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .lib-header h2{font-size:20px;margin:0;font-weight:700}

  .pillbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .pill-filter{background:var(--panel);border:1px solid var(--line2);color:var(--dim);
    border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
  .pill-filter.active{background:var(--amber);color:#1a1611;border-color:var(--amber)}
  .chip{background:var(--bg);border:1px solid var(--amber-dim);color:var(--amber);
    border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}

  #library-tracks{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    overflow-x:auto}
  table.tracklist{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tracklist th{text-align:left;padding:10px 12px;color:var(--dim);font-size:11.5px;
    text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);
    white-space:nowrap}
  table.tracklist th.sortable{cursor:pointer;user-select:none}
  table.tracklist th.sortable:hover{color:var(--ink)}
  table.tracklist th .arrow{color:var(--amber);margin-left:3px}
  table.tracklist td{padding:9px 12px;border-bottom:1px solid #221f1d;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:280px}
  table.tracklist tr:last-child td{border-bottom:0}
  table.tracklist tr:hover td{background:#1d1b18}
  table.tracklist td.num{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
    text-align:right}
  table.tracklist td.key{color:var(--amber);font-weight:600}

  .cover-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:16px}
  .cover-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px;cursor:pointer;transition:.15s}
  .cover-card:hover{border-color:var(--amber)}
  .cover-card .art{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    color:var(--line2);font-size:11px;margin-bottom:9px}
  .cover-card .art img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-card .t-album{font-size:13px;font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cover-card .t-artist{color:var(--dim);font-size:12px;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .lib-cover{width:52px;height:52px;border-radius:6px;overflow:hidden;flex:none;
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    color:var(--line2);font-size:9px}
  .lib-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .rel.with-cover{display:flex;gap:12px;align-items:flex-start}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}

  #drop{border:1.5px dashed var(--line2);border-radius:10px;padding:26px 18px;
    text-align:center;cursor:pointer;transition:.15s;color:var(--dim)}
  #drop:hover,#drop.hot{border-color:var(--amber);color:var(--ink);background:#1d1b18}
  #drop b{color:var(--ink);font-weight:600}
  #drop .hint{display:block;margin-top:6px;font-size:12.5px}

  #thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .thumb{position:relative;width:88px;height:88px;border-radius:7px;overflow:hidden;
    border:1px solid var(--line2)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;
    border:0;border-radius:50%;background:#000a;color:#fff;cursor:pointer;
    font-size:13px;line-height:20px;padding:0}

  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  button.go{background:var(--amber);color:#1a1611;border:0;border-radius:7px;
    padding:10px 20px;font-size:14.5px;font-weight:600;cursor:pointer}
  button.go:disabled{background:var(--amber-dim);color:#0009;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line2);
    border-radius:7px;padding:9px 14px;cursor:pointer;font-size:13.5px}

  .status{color:var(--dim);font-size:13px;min-height:19px;margin-top:10px}
  .status.err{color:var(--bad)}
  .status.ok{color:var(--ok)}

  #out{display:none;margin-top:18px}
  .rel{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
  .rel .artist{color:var(--amber);font-size:13px;letter-spacing:.09em;
    text-transform:uppercase;font-weight:600}
  .rel .album{font-size:25px;font-weight:600;margin:3px 0 7px;line-height:1.2}
  .rel .meta{color:var(--dim);font-size:13px}
  .rel .meta span+span:before{content:"·";margin:0 8px;color:var(--line2)}

  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:8px 6px;border-bottom:1px solid #221f1d;vertical-align:baseline}
  tr:last-child td{border-bottom:0}
  td.pos{width:44px;color:var(--amber);font-weight:600;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px}
  td.dur{width:58px;text-align:right;color:var(--dim);
    font-family:ui-monospace,Consolas,monospace;font-size:13px}
  td.bpm{width:104px;text-align:right;color:var(--line2);font-size:12px;font-style:italic}
  td.bpm.got{color:var(--dim);font-style:normal;
    font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  td.bpm .key{color:var(--amber);font-weight:600}

  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    color:var(--dim);font-size:12.5px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;
    border:1px solid var(--line2)}
  .pill.high{color:var(--ok);border-color:#2f4a34}
  .pill.medium{color:var(--amber);border-color:var(--amber-dim)}
  .pill.low{color:var(--bad);border-color:#4a2a24}
  .notes{color:var(--dim);font-size:12.5px;margin-top:8px;font-style:italic}
  .empty{color:var(--dim);text-align:center;padding:26px 0;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Slipmat</h1>
    <span class="sub">photograph a record &rarr; artist, album, tracklist</span>
    <div id="auth"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="scan">Scan</button>
    <button class="tab" data-tab="library">Library</button>
  </nav>

  <section id="scan-view">
    <div class="grid">
      <div class="panel">
        <div id="drop">
          <b>Drop photos, or tap to choose</b>
          <span class="hint">Front sleeve identifies it &middot; back cover has the tracklist</span>
          <span class="hint">On a phone this offers the camera or your gallery. Paste works too.</span>
        </div>
        <input id="file" type="file" accept="image/*" multiple hidden>
        <div id="thumbs"></div>
        <div class="row">
          <button class="go" id="go" disabled>Scan</button>
          <button class="ghost" id="clear">Clear</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <div id="out"></div>
        <div class="empty" id="empty">No record scanned yet.</div>
        <div class="row" id="saveRow" style="display:none">
          <button class="ghost" id="saveBtn">Save to library</button>
          <span class="status" id="saveStatus"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="library-view" style="display:none">
    <div class="lib-header">
      <h2>Your Library</h2>
    </div>
    <nav class="pillbar" id="library-pills">
      <button class="pill-filter active" data-view="albums">Albums</button>
      <button class="pill-filter" data-view="artists">Artists</button>
      <button class="pill-filter" data-view="tracks">Tracks</button>
      <span id="library-chip"></span>
      <button class="ghost" id="libListLink" style="margin-left:auto">View as list</button>
    </nav>
    <div class="cover-grid" id="library-grid"></div>
    <div id="library-tracks" style="display:none"></div>
    <div class="panel" id="library-panel" style="display:none">
      <div class="empty">No saved albums yet.</div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const drop = $('#drop'), fileIn = $('#file'), thumbs = $('#thumbs');
const go = $('#go'), status = $('#status'), out = $('#out'), empty = $('#empty');
let images = [];
let lastRecord = null;

// The library is entirely optional. Both values are blank unless a Supabase
// project is configured server-side (see app.py / .env.example) - blank
// means run exactly as before, with no accounts and no save button. The
// `typeof supabase` guard covers the CDN script failing to load, which
// should degrade the same way as never having configured a project at all.
const SUPABASE_URL = {{ supabase_url | tojson }};
const SUPABASE_ANON_KEY = {{ supabase_anon_key | tojson }};
const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let currentUser = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  thumbs.innerHTML = images.map((src,i)=>
    `<div class="thumb"><img src="${src}"><button data-i="${i}">&times;</button></div>`).join('');
  go.disabled = images.length === 0;
}
thumbs.onclick = e => {
  if (e.target.dataset.i !== undefined){ images.splice(+e.target.dataset.i,1); render(); }
};

// Downscale before upload: phone photos are ~4MB and the model reads 1568px fine.
function add(file){
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 1568, sc = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      if (images.length < 4){ images.push(c.toDataURL('image/jpeg',0.9)); render(); }
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

drop.onclick = () => fileIn.click();
fileIn.onchange = e => { [...e.target.files].forEach(add); fileIn.value=''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hot'); };
drop.ondragleave = () => drop.classList.remove('hot');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hot');
  [...e.dataTransfer.files].forEach(add); };
window.addEventListener('paste', e =>
  [...(e.clipboardData?.files||[])].forEach(add));

$('#clear').onclick = () => { images=[]; render(); status.textContent='';
  out.style.display='none'; empty.style.display='block';
  lastRecord = null; refreshSaveRow(); };

go.onclick = async () => {
  go.disabled = true;
  status.className = 'status';
  status.textContent = 'Reading sleeve…';
  const t0 = performance.now();
  try{
    const r = await fetch('/api/scan', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({images})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    show(d, (performance.now()-t0)/1000);
    status.textContent = '';
  } catch(err){
    status.className = 'status err';
    status.textContent = err.message;
  } finally { go.disabled = images.length===0; }
};

function show(d, secs){
  const meta = [d.year, d.label, d.catalog_number].filter(Boolean)
                 .map(x=>`<span>${esc(x)}</span>`).join('');
  const tracks = d.tracks || [];

  const rows = tracks.length
    ? tracks.map((t,i)=>`<tr>
        <td class="pos">${esc(t.position||'')}</td>
        <td>${esc(t.title||'?')}</td>
        <td class="dur">${esc(t.duration||'')}</td>
        <td class="bpm" id="bpm${i}">bpm / key</td></tr>`).join('')
    : `<tr><td colspan="4" class="empty">${
         d.tracklist_error
           ? esc(d.tracklist_error)
           : 'No tracklist found &mdash; photograph the back cover.'
       }</td></tr>`;

  const conf = esc(d.confidence||'?');
  out.innerHTML = `
    <div class="rel">
      <div class="artist">${esc(d.artist||'Unknown artist')}</div>
      <div class="album">${esc(d.album||'Unknown album')}</div>
      <div class="meta">${meta||'<span>no pressing details read</span>'}</div>
    </div>
    <table>${rows}</table>
    ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
    <div class="foot">
      <span>confidence <span class="pill ${conf}">${conf}</span></span>
      <span>tracklist: ${esc(d.tracklist_source||'?')}</span>
      <span>${esc(d._model||'')} &middot; ${secs.toFixed(1)}s${
        d._cost!=null ? ' &middot; $'+Number(d._cost).toFixed(4) : ''}</span>
    </div>`;
  out.style.display = 'block';
  empty.style.display = 'none';
  lastRecord = d;
  refreshSaveRow();
  loadBpm(d);
}

// BPM and key are looked up after the tracklist is already on screen - they
// take a round trip per track and the sleeve read is what you're waiting for.
// A second scan while the first is still resolving must not write into the new
// table, so each render claims a token and stale replies are dropped.
let bpmRun = 0;

async function loadBpm(d){
  const tracks = d.tracks || [];
  if (!tracks.some(t=>t.title)) return;

  const run = ++bpmRun;
  const cells = tracks.map((t,i)=>document.getElementById('bpm'+i));
  cells.forEach(c=>{ if(c) c.textContent='…'; });

  try{
    const r = await fetch('/api/bpm', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({artist:d.artist, titles:tracks.map(t=>t.title||'')})});
    const body = await r.json();
    if (run !== bpmRun) return;
    if (!r.ok) throw new Error(body.error || ('HTTP '+r.status));

    (body.results||[]).forEach((f,i)=>{
      const c = cells[i];
      if (f){
        // Written back onto the track itself, not just painted into the DOM -
        // Save to library reads from here, and the cell is thrown away the
        // next time show() runs.
        tracks[i].bpm = f.bpm; tracks[i].key = f.key; tracks[i].bpm_source = f.source;
      }
      if (!c) return;
      if (!f){ c.textContent = '—'; return; }
      c.classList.add('got');
      c.title = 'via ' + (f.source||'?');
      c.innerHTML = `${esc(String(f.bpm))} <span class="key">${esc(f.key||'')}</span>`;
    });
  } catch(err){
    if (run !== bpmRun) return;
    cells.forEach(c=>{ if(c) c.textContent='—'; });
    console.warn('bpm lookup failed:', err.message);
  }
}

// -------------------------------------------------------------- the library
// Everything past here is inert when supabaseClient is null - no project
// configured, same as the app before this feature existed.

function showTab(name){
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $('#scan-view').style.display = name === 'scan' ? '' : 'none';
  $('#library-view').style.display = name === 'library' ? '' : 'none';
  if (name === 'library') loadLibrary();
}
$('#tabs').addEventListener('click', e => {
  if (e.target.dataset.tab) showTab(e.target.dataset.tab);
});

// Three views onto the same fetched data, not three separate loads:
// Albums (cover grid), Artists (grouped, drills back into a filtered Albums
// grid), and List (the full Rekordbox-style detail, reached by picking an
// album or by the explicit link - not a pill, since it isn't a content type).
let libView = 'albums';
let libraryArtistFilter = null;

function showLibraryView(view){
  libView = view;
  $$('.pill-filter').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('#library-grid').style.display = (view === 'albums' || view === 'artists') ? 'grid' : 'none';
  $('#library-tracks').style.display = view === 'tracks' ? 'block' : 'none';
  $('#library-panel').style.display = view === 'list' ? 'block' : 'none';
  renderLibraryViews();
}

$('#libListLink').onclick = () => showLibraryView('list');

$('#library-pills').addEventListener('click', e => {
  if (e.target.id === 'clearArtistFilter'){
    libraryArtistFilter = null;
    renderLibraryViews();
    return;
  }
  const view = e.target.dataset.view;
  if (!view) return;
  libraryArtistFilter = null;   // switching content type drops any drill-down
  showLibraryView(view);
});

$('#library-grid').addEventListener('click', e => {
  const albumCard = e.target.closest('.cover-card[data-id]');
  if (albumCard){
    showLibraryView('list');
    document.getElementById('album-' + albumCard.dataset.id)
      ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const artistCard = e.target.closest('.cover-card[data-artist]');
  if (artistCard){
    libraryArtistFilter = artistCard.dataset.artist;
    showLibraryView('albums');
  }
});

function refreshSaveRow(){
  const row = $('#saveRow');
  const visible = !!(currentUser && lastRecord);
  row.style.display = visible ? 'flex' : 'none';
  if (visible){
    $('#saveBtn').disabled = false;
    $('#saveBtn').textContent = 'Save to library';
    $('#saveStatus').textContent = '';
    $('#saveStatus').className = 'status';
  }
}

function renderAuth(){
  const el = $('#auth');
  if (!supabaseClient){ el.innerHTML = ''; return; }

  if (currentUser){
    el.innerHTML = `
      <span class="who">${esc(currentUser.email)}</span>
      <button class="ghost" id="signOut">Sign out</button>`;
    $('#tabs').style.display = 'flex';
  } else {
    el.innerHTML = `
      <input id="authEmail" type="email" placeholder="email" autocomplete="email">
      <input id="authPass" type="password" placeholder="password" autocomplete="current-password">
      <button class="ghost" id="signIn">Sign in</button>
      <button class="ghost" id="signUp">Sign up</button>
      <span class="err" id="authErr"></span>`;
    $('#tabs').style.display = 'none';
    showTab('scan');
  }
  refreshSaveRow();
}

// The auth bar's own inputs/buttons are rebuilt by renderAuth() on every
// state change, so they're wired by delegation rather than by attaching
// handlers that would just be discarded on the next innerHTML replace.
$('#auth').addEventListener('click', async e => {
  const id = e.target.id;
  if (id !== 'signIn' && id !== 'signUp' && id !== 'signOut') return;

  if (id === 'signOut'){ await supabaseClient.auth.signOut(); return; }

  const email = $('#authEmail').value.trim();
  const password = $('#authPass').value;
  const err = $('#authErr');
  err.textContent = '';
  if (!email || !password){ err.textContent = 'email and password required'; return; }

  const fn = id === 'signIn' ? 'signInWithPassword' : 'signUp';
  const { error } = await supabaseClient.auth[fn]({ email, password });
  if (error) err.textContent = error.message;
  else if (id === 'signUp') err.textContent = 'Check your email to confirm, then sign in.';
});

if (supabaseClient){
  supabaseClient.auth.getSession().then(({ data }) => {
    currentUser = data.session?.user || null;
    renderAuth();
  });
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    currentUser = session?.user || null;
    renderAuth();
  });
}

async function saveToLibrary(d){
  if (!currentUser || !d) return;
  const btn = $('#saveBtn'), st = $('#saveStatus');
  btn.disabled = true;
  st.className = 'status';
  st.textContent = 'Saving…';

  try{
    const { data: album, error } = await supabaseClient.from('albums').insert({
      artist: d.artist || null, album: d.album || null, year: d.year || null,
      label: d.label || null, catalog_number: d.catalog_number || null,
      confidence: d.confidence || null, notes: d.notes || null,
      tracklist_source: d.tracklist_source || null, model: d._model || null,
    }).select().single();
    if (error) throw error;

    const trackRows = (d.tracks || []).map((t, i) => ({
      album_id: album.id, sort_index: i, position: t.position || null,
      title: t.title || '?', duration: t.duration || null,
      bpm: t.bpm ?? null, key_camelot: t.key ?? null, bpm_source: t.bpm_source ?? null,
    }));
    if (trackRows.length){
      const { error: terr } = await supabaseClient.from('tracks').insert(trackRows);
      if (terr) throw terr;
    }

    st.className = 'status ok';
    st.textContent = 'Saved.';
    btn.textContent = 'Saved';
  } catch(err){
    st.className = 'status err';
    st.textContent = err.message;
    btn.disabled = false;
  }
}
$('#saveBtn').onclick = () => saveToLibrary(lastRecord);

let libraryAlbums = [];

async function loadLibrary(){
  $('#library-grid').innerHTML = '<div class="empty">Loading…</div>';

  const { data, error } = await supabaseClient
    .from('albums')
    .select('*, tracks(*)')
    .order('created_at', { ascending: false })
    .order('sort_index', { foreignTable: 'tracks' });

  if (error){
    $('#library-grid').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    $('#library-panel').innerHTML = '';
    return;
  }

  libraryAlbums = data || [];
  renderLibraryViews();
  resolveMissingCovers();
}

function renderLibraryViews(){
  renderChip();

  if (!libraryAlbums.length){
    $('#library-grid').innerHTML = '<div class="empty">No saved albums yet.</div>';
    $('#library-tracks').innerHTML = '<div class="empty">No saved albums yet.</div>';
    $('#library-panel').innerHTML = '<div class="empty">No saved albums yet.</div>';
    return;
  }

  if (libView === 'tracks'){
    renderTracksTable();
  } else if (libView === 'artists'){
    $('#library-grid').innerHTML = groupByArtist(libraryAlbums).map(renderArtistTile).join('');
  } else {
    const shown = libraryArtistFilter
      ? libraryAlbums.filter(a => (a.artist||'Unknown artist') === libraryArtistFilter)
      : libraryAlbums;
    $('#library-grid').innerHTML = shown.length
      ? shown.map(renderCoverTile).join('')
      : '<div class="empty">No albums for this artist.</div>';
  }

  // List always shows everything, regardless of the grid's current filter -
  // it's reached to browse the whole detailed library, not one artist's slice.
  $('#library-panel').innerHTML = libraryAlbums.map(renderLibraryAlbum).join('<div class="foot"></div>');
}

// -------------------------------------------------------------- track list
// Rekordbox's Collection view: every track, flattened out of its album,
// sortable. BPM and Key are the two columns worth sorting on here - Title
// and Artist would just be alphabetising a crate, which isn't how anyone
// actually uses this.
let tracksSort = { col: null, dir: 1 };

function flattenTracks(albums){
  const out = [];
  for (const a of albums){
    for (const t of (a.tracks || [])){
      out.push({ ...t, artist: a.artist, album: a.album });
    }
  }
  return out;
}

// Camelot as a single number so both BPM and Key sort through the same
// null-handling comparator: 1A=0, 1B=1, 2A=2, ... 12B=23. Ascending walks
// the wheel in order rather than doing a plain string sort, where "10A"
// would wrongly land before "2A".
function keyRank(k){
  const m = /^(\d{1,2})([AB])$/.exec(k || '');
  return m ? (parseInt(m[1], 10) - 1) * 2 + (m[2] === 'B' ? 1 : 0) : null;
}

function sortTracks(rows){
  if (!tracksSort.col) return rows;
  const { col, dir } = tracksSort;
  return [...rows].sort((a, b) => {
    const av = col === 'bpm' ? a.bpm : keyRank(a.key_camelot);
    const bv = col === 'bpm' ? b.bpm : keyRank(b.key_camelot);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;    // blanks sort last, whichever direction
    if (bv == null) return -1;
    return (av - bv) * dir;
  });
}

function setTracksSort(col){
  if (tracksSort.col === col) tracksSort.dir *= -1;
  else tracksSort = { col, dir: 1 };
  renderTracksTable();
}

function renderTracksTable(){
  const rows = sortTracks(flattenTracks(libraryAlbums));
  const arrow = col => tracksSort.col === col
    ? `<span class="arrow">${tracksSort.dir === 1 ? '▲' : '▼'}</span>` : '';

  const body = rows.length
    ? rows.map(t => `<tr>
        <td>${esc(t.title || '?')}</td>
        <td>${esc(t.artist || 'Unknown artist')}</td>
        <td>${esc(t.album || '')}</td>
        <td class="num">${t.bpm != null ? esc(String(t.bpm)) : '—'}</td>
        <td class="num key">${esc(t.key_camelot || '—')}</td>
      </tr>`).join('')
    : `<tr><td colspan="5" class="empty">No tracks saved.</td></tr>`;

  $('#library-tracks').innerHTML = `
    <table class="tracklist">
      <thead><tr>
        <th>Title</th>
        <th>Artist</th>
        <th>Album</th>
        <th class="sortable" data-sort="bpm">BPM${arrow('bpm')}</th>
        <th class="sortable" data-sort="key">Key${arrow('key')}</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

$('#library-tracks').addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (th) setTracksSort(th.dataset.sort);
});

function renderChip(){
  $('#library-chip').innerHTML = libraryArtistFilter
    ? `<button class="chip" id="clearArtistFilter">${esc(libraryArtistFilter)} &times;</button>`
    : '';
}

function coverHtml(url){
  return url ? `<img src="${esc(url)}" loading="lazy" alt="">` : '&#9835;';
}

function renderCoverTile(a){
  return `
    <div class="cover-card" data-id="${a.id}">
      <div class="art" id="art-${a.id}">${coverHtml(a.cover_url)}</div>
      <div class="t-album">${esc(a.album||'Unknown album')}</div>
      <div class="t-artist">${esc(a.artist||'Unknown artist')}</div>
    </div>`;
}

// One tile per artist, most recently active first. There's no artist photo
// concept here - the tile borrows whichever of their albums has resolved
// cover art, same placeholder as an album tile if none has yet.
function groupByArtist(albums){
  const groups = new Map();
  for (const a of albums){
    const key = a.artist || 'Unknown artist';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }
  return [...groups.entries()]
    .map(([artist, albums]) => ({
      artist, albums,
      cover: albums.find(x => x.cover_url)?.cover_url || null,
    }))
    .sort((x, y) => new Date(y.albums[0].created_at) - new Date(x.albums[0].created_at));
}

function renderArtistTile(g){
  return `
    <div class="cover-card" data-artist="${esc(g.artist)}">
      <div class="art">${coverHtml(g.cover)}</div>
      <div class="t-album">${esc(g.artist)}</div>
      <div class="t-artist">${g.albums.length} album${g.albums.length === 1 ? '' : 's'}</div>
    </div>`;
}

function renderLibraryAlbum(a){
  const meta = [a.year, a.label, a.catalog_number].filter(Boolean)
                 .map(x=>`<span>${esc(x)}</span>`).join('');
  const tracks = a.tracks || [];

  const rows = tracks.length
    ? tracks.map(t=>`<tr>
        <td class="pos">${esc(t.position||'')}</td>
        <td>${esc(t.title||'?')}</td>
        <td class="dur">${esc(t.duration||'')}</td>
        <td class="bpm${t.bpm!=null?' got':''}">${
          t.bpm != null
            ? `${esc(String(t.bpm))} <span class="key">${esc(t.key_camelot||'')}</span>`
            : '—'
        }</td></tr>`).join('')
    : `<tr><td colspan="4" class="empty">No tracklist saved.</td></tr>`;

  const saved = new Date(a.created_at).toLocaleDateString();
  return `
    <div class="rel with-cover" id="album-${a.id}">
      <div class="lib-cover" id="thumb-${a.id}">${coverHtml(a.cover_url)}</div>
      <div>
        <div class="artist">${esc(a.artist||'Unknown artist')}</div>
        <div class="album">${esc(a.album||'Unknown album')}</div>
        <div class="meta">${meta||'<span>no pressing details read</span>'}</div>
      </div>
    </div>
    <table>${rows}</table>
    <div class="foot">
      <span>saved ${esc(saved)}</span>
      <button class="ghost" data-del="${a.id}">Delete</button>
    </div>`;
}

// -------------------------------------------------------------- cover art
// iTunes' search API: free, keyless, CORS-open, and it's the Apple Music
// catalogue - anything that ever had a digital release is in it. A vinyl-only
// white label won't be, same gap as the BPM lookup and for the same reason,
// so a miss just leaves the plain tile rather than blocking anything.
async function resolveCoverArt(artist, album){
  if (!album) return null;
  try{
    const r = await fetch('https://itunes.apple.com/search?' + new URLSearchParams({
      term: [artist, album].filter(Boolean).join(' '), entity: 'album', limit: 5,
    }));
    const body = await r.json();
    const wantArtist = (artist || '').toLowerCase().split(' ')[0];
    const hit = (body.results || []).find(it =>
      !wantArtist || (it.artistName || '').toLowerCase().includes(wantArtist));
    return hit?.artworkUrl100 ? hit.artworkUrl100.replace('100x100bb', '600x600bb') : null;
  } catch{
    return null;   // offline, or iTunes is down - never block the library on this
  }
}

async function resolveMissingCovers(){
  const missing = libraryAlbums.filter(a => !a.cover_url);
  if (!missing.length) return;

  await Promise.all(missing.map(async a => {
    const url = await resolveCoverArt(a.artist, a.album);
    if (!url) return;
    a.cover_url = url;
    // Cache it so the next visit costs nothing. Best-effort: a failed write
    // here just means resolving it again next time, not a broken library.
    // The await matters - supabase-js builds this lazily and never sends the
    // request at all unless something actually awaits or .then()s it.
    const { error: cerr } = await supabaseClient.from('albums')
      .update({ cover_url: url }).eq('id', a.id);
    if (cerr) console.warn('cover_url write-back failed (schema migrated?):', cerr.message);
  }));

  // One re-render once everything's settled, rather than patching individual
  // DOM nodes per album - a resolved cover needs to reach up to three places
  // now (the album tile, its list-view thumbnail, and its artist's tile),
  // and a full render is simpler to keep correct than patching all three.
  renderLibraryViews();
}

$('#library-panel').addEventListener('click', async e => {
  const id = e.target.dataset.del;
  if (!id) return;
  if (!confirm('Delete this album from your library?')) return;
  await supabaseClient.from('albums').delete().eq('id', id);   // tracks cascade
  loadLibrary();
});
</script>
</body>
