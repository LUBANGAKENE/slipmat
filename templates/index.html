<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slipmat</title>
<style>
  :root{
    --bg:#0e0d0c; --panel:#171614; --line:#2b2825; --line2:#3a3631;
    --ink:#ece6da; --dim:#8d857a; --amber:#d99b3f; --amber-dim:#7a5a24;
    --ok:#5f9e6a; --bad:#c4614f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}

  header{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
  h1{font-size:19px;margin:0;letter-spacing:.02em;font-weight:600}
  header .sub{color:var(--dim);font-size:13px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}

  #drop{border:1.5px dashed var(--line2);border-radius:10px;padding:26px 18px;
    text-align:center;cursor:pointer;transition:.15s;color:var(--dim)}
  #drop:hover,#drop.hot{border-color:var(--amber);color:var(--ink);background:#1d1b18}
  #drop b{color:var(--ink);font-weight:600}
  #drop .hint{display:block;margin-top:6px;font-size:12.5px}

  #thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .thumb{position:relative;width:88px;height:88px;border-radius:7px;overflow:hidden;
    border:1px solid var(--line2)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;
    border:0;border-radius:50%;background:#000a;color:#fff;cursor:pointer;
    font-size:13px;line-height:20px;padding:0}

  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  button.go{background:var(--amber);color:#1a1611;border:0;border-radius:7px;
    padding:10px 20px;font-size:14.5px;font-weight:600;cursor:pointer}
  button.go:disabled{background:var(--amber-dim);color:#0009;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line2);
    border-radius:7px;padding:9px 14px;cursor:pointer;font-size:13.5px}

  .status{color:var(--dim);font-size:13px;min-height:19px;margin-top:10px}
  .status.err{color:var(--bad)}

  #out{display:none;margin-top:18px}
  .rel{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
  .rel .artist{color:var(--amber);font-size:13px;letter-spacing:.09em;
    text-transform:uppercase;font-weight:600}
  .rel .album{font-size:25px;font-weight:600;margin:3px 0 7px;line-height:1.2}
  .rel .meta{color:var(--dim);font-size:13px}
  .rel .meta span+span:before{content:"·";margin:0 8px;color:var(--line2)}

  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:8px 6px;border-bottom:1px solid #221f1d;vertical-align:baseline}
  tr:last-child td{border-bottom:0}
  td.pos{width:44px;color:var(--amber);font-weight:600;
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px}
  td.dur{width:58px;text-align:right;color:var(--dim);
    font-family:ui-monospace,Consolas,monospace;font-size:13px}
  td.bpm{width:104px;text-align:right;color:var(--line2);font-size:12px;font-style:italic}
  td.bpm.got{color:var(--dim);font-style:normal;
    font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  td.bpm .key{color:var(--amber);font-weight:600}

  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    color:var(--dim);font-size:12.5px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;
    border:1px solid var(--line2)}
  .pill.high{color:var(--ok);border-color:#2f4a34}
  .pill.medium{color:var(--amber);border-color:var(--amber-dim)}
  .pill.low{color:var(--bad);border-color:#4a2a24}
  .notes{color:var(--dim);font-size:12.5px;margin-top:8px;font-style:italic}
  .empty{color:var(--dim);text-align:center;padding:26px 0;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Slipmat</h1>
    <span class="sub">photograph a record &rarr; artist, album, tracklist</span>
  </header>

  <div class="grid">
    <div class="panel">
      <div id="drop">
        <b>Drop photos, or tap to choose</b>
        <span class="hint">Front sleeve identifies it &middot; back cover has the tracklist</span>
        <span class="hint">On a phone this offers the camera or your gallery. Paste works too.</span>
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div id="thumbs"></div>
      <div class="row">
        <button class="go" id="go" disabled>Scan</button>
        <button class="ghost" id="clear">Clear</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="panel">
      <div id="out"></div>
      <div class="empty" id="empty">No record scanned yet.</div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileIn = $('#file'), thumbs = $('#thumbs');
const go = $('#go'), status = $('#status'), out = $('#out'), empty = $('#empty');
let images = [];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  thumbs.innerHTML = images.map((src,i)=>
    `<div class="thumb"><img src="${src}"><button data-i="${i}">&times;</button></div>`).join('');
  go.disabled = images.length === 0;
}
thumbs.onclick = e => {
  if (e.target.dataset.i !== undefined){ images.splice(+e.target.dataset.i,1); render(); }
};

// Downscale before upload: phone photos are ~4MB and the model reads 1568px fine.
function add(file){
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 1568, sc = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      if (images.length < 4){ images.push(c.toDataURL('image/jpeg',0.9)); render(); }
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

drop.onclick = () => fileIn.click();
fileIn.onchange = e => { [...e.target.files].forEach(add); fileIn.value=''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hot'); };
drop.ondragleave = () => drop.classList.remove('hot');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hot');
  [...e.dataTransfer.files].forEach(add); };
window.addEventListener('paste', e =>
  [...(e.clipboardData?.files||[])].forEach(add));

$('#clear').onclick = () => { images=[]; render(); status.textContent='';
  out.style.display='none'; empty.style.display='block'; };

go.onclick = async () => {
  go.disabled = true;
  status.className = 'status';
  status.textContent = 'Reading sleeve…';
  const t0 = performance.now();
  try{
    const r = await fetch('/api/scan', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({images})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    show(d, (performance.now()-t0)/1000);
    status.textContent = '';
  } catch(err){
    status.className = 'status err';
    status.textContent = err.message;
  } finally { go.disabled = images.length===0; }
};

function show(d, secs){
  const meta = [d.year, d.label, d.catalog_number].filter(Boolean)
                 .map(x=>`<span>${esc(x)}</span>`).join('');
  const tracks = d.tracks || [];

  const rows = tracks.length
    ? tracks.map((t,i)=>`<tr>
        <td class="pos">${esc(t.position||'')}</td>
        <td>${esc(t.title||'?')}</td>
        <td class="dur">${esc(t.duration||'')}</td>
        <td class="bpm" id="bpm${i}">bpm / key</td></tr>`).join('')
    : `<tr><td colspan="4" class="empty">${
         d.tracklist_error
           ? esc(d.tracklist_error)
           : 'No tracklist found &mdash; photograph the back cover.'
       }</td></tr>`;

  const conf = esc(d.confidence||'?');
  out.innerHTML = `
    <div class="rel">
      <div class="artist">${esc(d.artist||'Unknown artist')}</div>
      <div class="album">${esc(d.album||'Unknown album')}</div>
      <div class="meta">${meta||'<span>no pressing details read</span>'}</div>
    </div>
    <table>${rows}</table>
    ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
    <div class="foot">
      <span>confidence <span class="pill ${conf}">${conf}</span></span>
      <span>tracklist: ${esc(d.tracklist_source||'?')}</span>
      <span>${esc(d._model||'')} &middot; ${secs.toFixed(1)}s${
        d._cost!=null ? ' &middot; $'+Number(d._cost).toFixed(4) : ''}</span>
    </div>`;
  out.style.display = 'block';
  empty.style.display = 'none';
  loadBpm(d);
}

// BPM and key are looked up after the tracklist is already on screen - they
// take a round trip per track and the sleeve read is what you're waiting for.
// A second scan while the first is still resolving must not write into the new
// table, so each render claims a token and stale replies are dropped.
let bpmRun = 0;

async function loadBpm(d){
  const tracks = d.tracks || [];
  if (!tracks.some(t=>t.title)) return;

  const run = ++bpmRun;
  const cells = tracks.map((t,i)=>document.getElementById('bpm'+i));
  cells.forEach(c=>{ if(c) c.textContent='…'; });

  try{
    const r = await fetch('/api/bpm', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({artist:d.artist, titles:tracks.map(t=>t.title||'')})});
    const body = await r.json();
    if (run !== bpmRun) return;
    if (!r.ok) throw new Error(body.error || ('HTTP '+r.status));

    (body.results||[]).forEach((f,i)=>{
      const c = cells[i];
      if (!c) return;
      if (!f){ c.textContent = '—'; return; }
      c.classList.add('got');
      c.title = 'via ' + (f.source||'?');
      c.innerHTML = `${esc(String(f.bpm))} <span class="key">${esc(f.key||'')}</span>`;
    });
  } catch(err){
    if (run !== bpmRun) return;
    cells.forEach(c=>{ if(c) c.textContent='—'; });
    console.warn('bpm lookup failed:', err.message);
  }
}
</script>
</body>
</html>
